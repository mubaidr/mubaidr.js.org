list:
  - label: "What services do you offer?"
    content: "Full-stack development (Vue, Nuxt, React, Laravel, Node.js), AI agent systems and LLM integration, technical architecture and consulting, browser extension development, MVP builds, project rescue, and ongoing support retainers. Most engagements are contract-based — fixed-scope or time-and-materials."
  - label: "What's your typical engagement model?"
    content: "I work async-first. Projects start with a written brief, followed by a scoped proposal with timeline and cost. Development happens in short cycles with async updates and regular demos. I prefer clear written requirements over long calls, and I keep you informed without flooding your inbox."
  - label: "What tech stack do you specialize in?"
    content: "Frontend: Vue 3, Nuxt 4, React, TypeScript. Backend: Laravel, Node.js, Python. Infrastructure: Docker, Cloudflare, GitHub Actions, VPS/cloud deployments. AI: OpenAI, Anthropic, Gemini APIs, RAG pipelines, LLM orchestration. I'm framework-pragmatic — stack choices depend on what solves the problem well."
  - label: "Can you help with AI agent systems and LLM integrations?"
    content: "Yes — this is a primary focus. I build multi-agent orchestration systems, RAG pipelines, LLM-powered tools, and AI-augmented workflows. I also maintain gem-team, an open-source AI agent orchestration framework. I focus on production-grade systems, not proof-of-concept demos."
  - label: "Do you work on existing codebases or only greenfield projects?"
    content: "Both. I do greenfield builds, feature additions on existing systems, refactors, and project rescues. For rescue work, I start with an audit to identify root causes before proposing a fix — I won't quote a rewrite without understanding why the current system fails."
  - label: "What are your rates and payment terms?"
    content: "Rates depend on scope, complexity, and engagement model. I work hourly for smaller tasks and ongoing support, and fixed-price for well-defined projects. Fixed-price projects typically require a 30-50% deposit upfront with milestone-based payments. Terms are outlined in a written agreement before work starts."
  - label: "How do you handle scope changes?"
    content: "Any change to agreed scope goes through a brief written change request — impact on timeline and cost is assessed and confirmed before implementation. This keeps things predictable for both sides. I don't silently absorb scope creep, and I don't hold projects hostage over minor changes."
  - label: "Do you offer post-launch support and maintenance?"
    content: "Yes. I offer retainer-based support with defined response times and scope, or ad-hoc hourly support. For projects I build, I stay available during the first month post-launch to handle any issues that come up."
  - label: "What's the initial consultation like?"
    content: "Send me a brief with your project goals, current state, timeline, and budget range. I'll review it and either reply with questions or schedule a 30-60 minute call to discuss fit and approach. I don't do speculative proposals — if we're aligned on the brief, I'll prepare a detailed proposal with scope, timeline, and cost."
  - label: "Who owns the code and IP?"
    content: "Upon full payment, you own the code I write specifically for your project. Any open-source libraries or pre-existing tools remain under their original licenses. This is spelled out clearly in the contract."
  - label: "How do you stay available across time zones?"
    content: "I work async-first, which makes time zones largely irrelevant for day-to-day progress. I commit to responding to messages within one business day. For urgent issues, I maintain a faster response channel for active clients."
